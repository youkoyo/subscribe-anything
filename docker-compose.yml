services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=subscribe_anything
      - POSTGRES_USER=subscribe
      - POSTGRES_PASSWORD=subscribe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://subscribe:subscribe@postgres:5432/subscribe_anything
    restart: unless-stopped

volumes:
  postgres_data:
