  <path d="M548 510L931 385L931 424L548 521V510Z" fill="url(#spectrum)" opacity="0.82"/>
  <path d="M548 512L931 457L931 489L548 524V512Z" fill="url(#spectrum)" opacity="0.72"/>
  <path d="M548 515L931 528L931 558L548 529V515Z" fill="url(#spectrum)" opacity="0.76"/>
  <path d="M548 519L931 611L931 647L548 532V519Z" fill="url(#spectrum)" opacity="0.58"/>

  <!-- structured information traces -->
  <g stroke="url(#nodeGrad)" stroke-width="11" stroke-linecap="round" opacity="0.94">
    <path d="M675 421H802L850 397"/>
    <path d="M652 462H826L882 449"/>
    <path d="M638 505H845L908 505"/>
    <path d="M652 548H826L882 567"/>
    <path d="M675 589H802L850 626"/>
  </g>
  <g fill="url(#nodeGrad)" filter="url(#tinyGlow)">
