    <rect x="327" y="406" width="14" height="14" rx="3" fill="#38BDF8" opacity="0.9"/>
    <circle cx="258" cy="508" r="4" fill="#7C3AED"/>
    <circle cx="312" cy="535" r="3" fill="#38BDF8"/>
    <circle cx="351" cy="480" r="3" fill="#60A5FA"/>
  </g>

