  <g filter="url(#softGlow)">
    <path d="M512 174L365 357V667L512 850L512 174Z" fill="url(#leftFace)"/>
    <path d="M512 174L659 357V667L512 850L512 174Z" fill="url(#rightFace)"/>
    <path d="M512 293L659 357V667L512 747L365 667V357L512 293Z" fill="url(#centerFace)" opacity="0.78"/>

    <g clip-path="url(#prismClip)">
      <ellipse cx="512" cy="536" rx="238" ry="150" fill="url(#nebula)" opacity="0.95"/>
      <path d="M352 596C421 506 575 473 671 534" stroke="#A78BFA" stroke-width="9" stroke-linecap="round" opacity="0.45"/>
      <path d="M389 624C468 558 576 540 637 577" stroke="#22D3EE" stroke-width="7" stroke-linecap="round" opacity="0.58"/>
      <path d="M433 645C492 612 555 605 599 626" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.68"/>
      <circle cx="464" cy="471" r="5" fill="#FFFFFF" opacity="0.78"/>
      <circle cx="548" cy="434" r="4" fill="#BAE6FD" opacity="0.9"/>
      <circle cx="590" cy="513" r="3" fill="#FFFFFF" opacity="0.75"/>
      <circle cx="447" cy="585" r="3" fill="#E0E7FF" opacity="0.86"/>
      <circle cx="528" cy="633" r="4" fill="#FFFFFF" opacity="0.72"/>
      <circle cx="607" cy="611" r="3" fill="#A5F3FC" opacity="0.86"/>
    </g>

    <path d="M512 174L365 357V667L512 850L659 667V357L512 174Z" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" opacity="0.95"/>
    <path d="M512 174V850" stroke="#FFFFFF" stroke-width="9" opacity="0.92"/>
    <path d="M365 357L512 293L659 357" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round" opacity="0.9"/>
    <path d="M365 667L512 747L659 667" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round" opacity="0.86"/>
  </g>

  <!-- bright prism interaction points -->
  <g filter="url(#tinyGlow)">
    <circle cx="365" cy="512" r="15" fill="#FFFFFF"/>
    <circle cx="548" cy="512" r="12" fill="#FFFFFF"/>
    <circle cx="512" cy="548" r="7" fill="#A5F3FC"/>
