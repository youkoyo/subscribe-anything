    <linearGradient id="nodeGrad" x1="649" y1="444" x2="913" y2="583" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.48" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.16 0 0 0 0 0.32 0 0 0 0 1 0 0 0 0.6 0" result="glow"/>
      <feBlend in="SourceGraphic" in2="glow" mode="screen"/>
    </filter>
    <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
    <clipPath id="prismClip">
      <path d="M512 174L659 357V667L512 850L365 667V357L512 174Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="#06112f"/>

  <!-- orbital prism halo -->
  <path d="M279 689C204 577 219 424 316 328C383 262 474 236 559 251" stroke="url(#ringGrad)" stroke-width="30" stroke-linecap="round" opacity="0.9"/>
  <path d="M675 284C778 335 836 450 811 561C793 644 736 715 659 750" stroke="url(#ringGrad)" stroke-width="30" stroke-linecap="round" opacity="0.78"/>
  <path d="M735 219L754 268L803 287L754 306L735 355L716 306L667 287L716 268L735 219Z" fill="#4F46E5" opacity="0.92"/>

