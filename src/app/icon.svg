<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="188" y1="794" x2="826" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.46" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="359" y1="239" x2="521" y2="774" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="0.46" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="669" y1="239" x2="514" y2="772" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.52" stop-color="#3730A3"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="centerFace" x1="512" y1="238" x2="512" y2="786" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF2FF" stop-opacity="0.92"/>
      <stop offset="0.14" stop-color="#818CF8" stop-opacity="0.72"/>
      <stop offset="0.48" stop-color="#312E81" stop-opacity="0.78"/>
      <stop offset="0.76" stop-color="#0EA5E9" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 535) rotate(72) scale(233 146)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.14" stop-color="#22D3EE" stop-opacity="0.88"/>
      <stop offset="0.36" stop-color="#6366F1" stop-opacity="0.62"/>
      <stop offset="0.68" stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayBlue" x1="111" y1="512" x2="379" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#60A5FA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="551" y1="503" x2="931" y2="503" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.16" stop-color="#22D3EE"/>
      <stop offset="0.36" stop-color="#2563EB"/>
      <stop offset="0.6" stop-color="#7C3AED"/>
